name: Godot CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Godot 4.7.2
        run: |
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
      - name: Import
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Tests
        run: |
          set -e
          for test in tests/test_*.gd; do
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$test"
          done
