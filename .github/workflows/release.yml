name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android export tools
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/godot-4.7.2
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-linux-templates-v1
      - name: Download Godot and official templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p "$HOME/godot-4.7.2" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot-4.7.2"
          curl -fL "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Set version and Android editor configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; fi
          sed -i "s/^config\/version=.*/config\/version=\"$version\"/" project.godot
          IFS=. read -r major minor patch <<< "$version"
          major=$((10#$major)); minor=$((10#$minor)); patch=$((10#$patch))
          if ((major > 999 || minor > 999 || patch > 999)); then echo 'Version component too large for Android'; exit 1; fi
          version_code=$((major * 1000000 + minor * 1000 + patch + 1))
          sed -i "s/^version\/name=.*/version\/name=\"$version\"/; s/^version\/code=.*/version\/code=$version_code/" export_presets.cfg
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          keytool -genkeypair -keystore "$RUNNER_TEMP/scrapforge-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Scrapforge Debug,O=Scrapforge,C=US' -noprompt
      - name: Import and export
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/scrapforge-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -eu
          godot="$HOME/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64"
          "$godot" --headless --editor --path . --quit
          mkdir -p build/windows build/linux
          "$godot" --headless --path . --export-release 'Windows Desktop' "$PWD/build/windows/Scrapforge.exe"
          "$godot" --headless --path . --export-release 'Linux/X11' "$PWD/build/linux/Scrapforge.x86_64"
          "$godot" --headless --path . --export-debug 'Android' "$PWD/build/Scrapforge-android.apk"
          chmod +x build/linux/Scrapforge.x86_64
          (cd build/windows && zip -q ../Scrapforge-windows-x86_64.zip ./*)
          (cd build/linux && zip -q ../Scrapforge-linux-x86_64.zip ./*)
      - name: Publish release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/Scrapforge-windows-x86_64.zip
            build/Scrapforge-linux-x86_64.zip
            build/Scrapforge-android.apk
